<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
<title>BPDB Kroegkaart</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#f6f3ee" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1e2023" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=Nunito:wght@700;800;900&display=swap">
<style>
/* Layout: iPhone eerst. Kaart vult het scherm, alles erboven is glas: een bottom sheet met drie standen (zoals Kaarten op iOS), zwevende kaartknoppen rechtsboven. Vanaf 900px wordt de sheet een zwevende zijbalk links. */
:root {
  /* Kaart, in de stijl van Apple Kaarten (licht) */
  --land: #f6f3ee; --block: #ebe6de; --road: #ffffff; --casing: #ddd5c9; --major: #ffe7a3; --major-casing: #ecc35a;
  --water: #a9d6f5; --park: #cde8b8; --rail: #c4bdb2; --label: #7c766d; --label-water: #3f86bd;
  --fog: #9a9ba1; --fog-op: .30; --fogdot: #5c5d63;
  /* Interface, iOS-systeemkleuren */
  --surface: #ffffff; --surface-2: #f2f2f7; --glass: rgb(250 250 252 / .74); --sep: rgb(60 60 67 / .16);
  --fg: #1c1c1e; --muted: #6e6e73;
  --accent: #ffc21a; --accent-ink: #2a1d00; --accent-text: #946400;
  --fresh: #34c759; --fresh-t: #1f8a3c; --stale: #ff9500; --stale-t: #c45200; --old: #ff3b30; --old-t: #d70015;
  --locked: #aeaeb2; --blue: #007aff;
  --a1: #5e5ce6; --a2: #ff2d55; --a3: #30b0c7; --a4: #af52de; --a5: #32ade6; --a6: #00c7be;
  --shadow: 0 10px 34px rgb(0 0 0 / .14), 0 1px 3px rgb(0 0 0 / .08);
  --hair: .5px solid var(--sep);

  --f-ui: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Figtree", system-ui, sans-serif;
  --f-round: ui-rounded, "SF Pro Rounded", "Nunito", -apple-system, "Figtree", sans-serif;
  --r: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --land: #1e2023; --block: #282b2f; --road: #3a3e44; --casing: #17181a; --major: #6a5a30; --major-casing: #3d3422;
    --water: #0f3150; --park: #1b3326; --rail: #4c5057; --label: #8e8e93; --label-water: #64a6dc;
    --fog: #050607; --fog-op: .48; --fogdot: #8e8e93;
    --surface: #1c1c1e; --surface-2: #2c2c2e; --glass: rgb(30 30 32 / .72); --sep: rgb(84 84 88 / .55);
    --fg: #f2f2f7; --muted: #98989f;
    --accent: #ffc83d; --accent-ink: #261a00; --accent-text: #ffd35c;
    --fresh: #30d158; --fresh-t: #30d158; --stale: #ff9f0a; --stale-t: #ff9f0a; --old: #ff453a; --old-t: #ff6961;
    --locked: #636366; --blue: #0a84ff;
    --shadow: 0 10px 34px rgb(0 0 0 / .5), 0 1px 3px rgb(0 0 0 / .3);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --land: #1e2023; --block: #282b2f; --road: #3a3e44; --casing: #17181a; --major: #6a5a30; --major-casing: #3d3422;
  --water: #0f3150; --park: #1b3326; --rail: #4c5057; --label: #8e8e93; --label-water: #64a6dc;
  --fog: #050607; --fog-op: .48; --fogdot: #8e8e93;
  --surface: #1c1c1e; --surface-2: #2c2c2e; --glass: rgb(30 30 32 / .72); --sep: rgb(84 84 88 / .55);
  --fg: #f2f2f7; --muted: #98989f;
  --accent: #ffc83d; --accent-ink: #261a00; --accent-text: #ffd35c;
  --fresh: #30d158; --fresh-t: #30d158; --stale: #ff9f0a; --stale-t: #ff9f0a; --old: #ff453a; --old-t: #ff6961;
  --locked: #636366; --blue: #0a84ff;
  --shadow: 0 10px 34px rgb(0 0 0 / .5), 0 1px 3px rgb(0 0 0 / .3);
  color-scheme: dark;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
html, body { height: 100%; overflow: hidden; }
body { background: var(--land); color: var(--fg); font-family: var(--f-ui); font-size: 15px; line-height: 1.4; -webkit-font-smoothing: antialiased; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2.5px solid var(--blue); outline-offset: 2px; }
.tn { font-variant-numeric: tabular-nums; }
.glass { background: var(--glass); -webkit-backdrop-filter: blur(28px) saturate(1.8); backdrop-filter: blur(28px) saturate(1.8); border: var(--hair); box-shadow: var(--shadow); }

/* ---------- Kaart ---------- */
#mapEl { position: fixed; inset: 0; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
#mapSvg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#pins { position: absolute; inset: 0; pointer-events: none; }
.m-land { fill: var(--land); }
.m-block { fill: var(--block); }
.m-park { fill: var(--park); }
.m-water { fill: none; stroke: var(--water); stroke-linecap: round; stroke-linejoin: round; }
.m-casing { fill: none; stroke: var(--casing); stroke-linecap: round; stroke-linejoin: round; }
.m-road { fill: none; stroke: var(--road); stroke-linecap: round; stroke-linejoin: round; }
.m-major-casing { fill: none; stroke: var(--major-casing); stroke-linecap: round; stroke-linejoin: round; }
.m-major { fill: none; stroke: var(--major); stroke-linecap: round; stroke-linejoin: round; }
.m-rail { fill: none; stroke: var(--rail); }
.m-rail-dash { fill: none; stroke: var(--land); stroke-dasharray: 6 6; }
.m-dist { fill: var(--label); font: 600 10px var(--f-ui); letter-spacing: .18em; text-transform: uppercase; opacity: .85; }
.m-street { fill: var(--label); font: 500 6.5px var(--f-ui); }
.m-waterlbl { fill: var(--label-water); font: italic 600 11px var(--f-ui); letter-spacing: .06em; }
.m-poi { fill: var(--fg); font: 600 7.5px var(--f-ui); opacity: .7; }
.m-fog { fill: var(--fog); opacity: var(--fog-op); }
.m-fogdots { opacity: .5; }
.wijk-blob { opacity: 0; transition: opacity .35s; }
.show-wijken .wijk-blob { opacity: .2; }
.wijk-lbl { opacity: 0; transition: opacity .35s; font: 800 9px var(--f-round); letter-spacing: .04em; paint-order: stroke; stroke: var(--land); stroke-width: 3px; }
.show-wijken .wijk-lbl { opacity: 1; }

/* Kaartspelden: vaste pixelgrootte, net als in Kaarten */
.pin { position: absolute; left: 0; top: 0; width: 0; height: 0; padding: 0; border: 0; background: none; pointer-events: auto; will-change: transform; }
.pin > * { position: absolute; display: none; }
.pin.m-pill .pill, .pin.m-dot .dotm, .pin.m-lock .lockm { display: flex; }
.pin.off { display: none; }
.pill { left: 0; bottom: 7px; transform: translateX(-50%); align-items: center; gap: 5px; height: 27px; padding: 0 10px 0 7px; border-radius: 14px; background: var(--surface); box-shadow: 0 2px 8px rgb(0 0 0 / .18), 0 0 0 .5px rgb(0 0 0 / .08); font: 800 13.5px var(--f-round); white-space: nowrap; color: var(--fg); transition: transform .18s; }
.pill::after { content: ""; position: absolute; left: 50%; bottom: -5px; width: 10px; height: 10px; background: inherit; transform: translateX(-50%) rotate(45deg); border-radius: 2px; z-index: -1; }
.pill .fd { width: 9px; height: 9px; border-radius: 50%; flex: none; }
.pill .pv { display: inline-flex; align-items: center; gap: 3px; }
.pill svg { width: 13px; height: 13px; }
.pin.mine .pill { background: var(--accent); color: var(--accent-ink); }
.pill .vac { color: var(--old); }
.pin.sel .pill { transform: translateX(-50%) scale(1.14); box-shadow: 0 6px 18px rgb(0 0 0 / .28), 0 0 0 2.5px var(--blue); }
.dotm { left: -6px; top: -6px; width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--surface); box-shadow: 0 1px 3px rgb(0 0 0 / .3); }
.pin.is-locked .dotm { left: -4px; top: -4px; width: 8px; height: 8px; border-width: 1.5px; background: var(--locked); }
.pin.sel .dotm { box-shadow: 0 0 0 3px var(--blue); }
.lockm { left: -12px; top: -12px; width: 24px; height: 24px; border-radius: 50%; align-items: center; justify-content: center; background: var(--glass); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); border: 1px dashed var(--locked); color: var(--muted); }
.lockm svg { width: 11px; height: 11px; }
.pin.sel .lockm { border: 2px solid var(--blue); color: var(--blue); }
.pin:focus-visible { outline: none; }
.pin:focus-visible .pill, .pin:focus-visible .lockm, .pin:focus-visible .dotm { outline: 2.5px solid var(--blue); outline-offset: 2px; }
.ripple { position: absolute; width: 20px; height: 20px; margin: -10px 0 0 -10px; border-radius: 50%; border: 2px solid var(--accent); pointer-events: none; animation: rip 1.1s ease-out forwards; }
@keyframes rip { to { transform: scale(9); opacity: 0; border-width: .5px; } }
.me-loc { position: absolute; width: 0; height: 0; pointer-events: none; }
.me-loc::before { content: ""; position: absolute; left: -24px; top: -24px; width: 48px; height: 48px; border-radius: 50%; background: var(--blue); opacity: .16; animation: pulse 2.4s ease-in-out infinite; }
.me-loc::after { content: ""; position: absolute; left: -8px; top: -8px; width: 16px; height: 16px; border-radius: 50%; background: var(--blue); border: 3px solid #fff; box-shadow: 0 1px 4px rgb(0 0 0 / .35); }
@keyframes pulse { 50% { transform: scale(.55); opacity: .3; } }

/* ---------- Zwevende knoppen ---------- */
.city-chip { position: fixed; top: calc(env(safe-area-inset-top, 0px) + 10px); left: max(12px, env(safe-area-inset-left, 0px)); display: flex; align-items: center; gap: 9px; padding: 6px 12px 6px 6px; border-radius: 22px; z-index: 10; }
.city-chip b { display: block; font-size: 13.5px; line-height: 1.1; }
.city-chip span { font-size: 11.5px; color: var(--muted); }
.ring { width: 32px; height: 32px; transform: rotate(-90deg); flex: none; }
.ring circle { fill: none; stroke-width: 4; }
.ring .bg { stroke: var(--sep); }
.ring .fg { stroke: var(--accent); stroke-linecap: round; transition: stroke-dashoffset .8s ease; }
.ctrls { position: fixed; top: calc(env(safe-area-inset-top, 0px) + 10px); right: max(12px, env(safe-area-inset-right, 0px)); display: grid; border-radius: 12px; overflow: hidden; z-index: 10; }
.ctrls button { width: 44px; height: 44px; display: grid; place-items: center; border: 0; background: none; color: var(--blue); }
.ctrls button + button { border-top: var(--hair); }
.ctrls button[aria-pressed="true"] { color: var(--accent-text); }
.ctrls svg { width: 20px; height: 20px; }
.ctrls .zoom { display: none; }
@media (hover: hover) and (pointer: fine) { .ctrls .zoom { display: grid; } }

/* ---------- Sheet ---------- */
.sheet { position: fixed; left: 0; right: 0; bottom: 0; height: calc(100% - env(safe-area-inset-top, 0px) - 10px); display: flex; flex-direction: column; border-radius: 16px 16px 0 0; z-index: 20; transform: translateY(var(--sy, 60%)); transition: transform .42s cubic-bezier(.2,.9,.25,1); border-bottom: 0; }
.sheet.dragging { transition: none; }
.grab { padding: 7px max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px)); touch-action: none; cursor: grab; flex: none; }
.grab::before { content: ""; display: block; width: 38px; height: 5px; border-radius: 3px; background: var(--sep); margin: 0 auto 9px; }
.searchrow { display: flex; gap: 10px; align-items: center; }
.search { flex: 1; display: flex; align-items: center; gap: 7px; background: var(--surface-2); border-radius: 11px; padding: 0 10px; height: 38px; min-width: 0; }
.search svg { width: 16px; height: 16px; color: var(--muted); flex: none; }
.search input { border: 0; background: none; outline: none; width: 100%; font-size: 16px; min-width: 0; }
.search input::placeholder { color: var(--muted); }
.me-btn { display: flex; align-items: center; gap: 7px; border: 0; background: none; padding: 0; flex: none; }
.me-btn .pts { font: 800 15px var(--f-round); display: block; line-height: 1.1; }
.me-btn small { display: block; font-size: 10.5px; color: var(--muted); line-height: 1; text-align: left; }
.av { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font: 800 12px var(--f-round); color: #fff; flex: none; }
.av.sm { width: 26px; height: 26px; font-size: 10px; }
.av.me { background: var(--accent); color: var(--accent-ink); }
.segm { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--surface-2); border-radius: 9px; padding: 2px; margin-top: 10px; }
.segm button { border: 0; background: none; border-radius: 7px; padding: 6px 4px; font-size: 13px; font-weight: 600; color: var(--fg); }
.segm button[aria-pressed="true"] { background: var(--surface); box-shadow: 0 2px 6px rgb(0 0 0 / .12), 0 0 0 .5px rgb(0 0 0 / .04); }
.body { flex: 1; overflow-y: auto; overscroll-behavior: contain; padding: 4px max(16px, env(safe-area-inset-right, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); display: grid; grid-auto-rows: max-content; gap: 18px; align-content: start; }

/* Inhoud */
.lt h1 { font-size: 28px; font-weight: 800; letter-spacing: -.02em; margin: 0; line-height: 1.1; }
.lt p { margin: 2px 0 0; color: var(--muted); font-size: 14px; }
.fbar { display: flex; height: 8px; gap: 2px; border-radius: 4px; overflow: hidden; }
.fbar i { display: block; transition: flex-grow .6s; }
.fbar-key { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12px; color: var(--muted); margin-top: 7px; }
.fbar-key span { display: inline-flex; align-items: center; gap: 5px; }
.d { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }
.tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.tile { background: var(--surface-2); border-radius: 12px; padding: 10px 11px; min-width: 0; }
.tile b { display: block; font: 800 19px var(--f-round); letter-spacing: -.01em; }
.tile span { font-size: 11.5px; color: var(--muted); line-height: 1.25; display: block; }
.near { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; padding: 12px; border-radius: var(--r); background: color-mix(in srgb, var(--accent) 16%, var(--surface)); border: .5px solid color-mix(in srgb, var(--accent) 50%, transparent); text-align: left; width: 100%; }
.near .ic { width: 38px; height: 38px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; }
.near .ic svg { width: 18px; height: 18px; }
.near b { display: block; font-size: 14.5px; }
.near > span > span { font-size: 12.5px; color: var(--muted); }
.near .go { background: var(--accent); color: var(--accent-ink); border-radius: 10px; padding: 8px 12px; font-size: 14px; font-weight: 700; white-space: nowrap; }
.cap { font-size: 12.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; margin: 0 0 6px 4px; font-weight: 500; }
.grp { background: var(--surface); border-radius: var(--r); overflow: hidden; border: var(--hair); }
.row { display: grid; grid-template-columns: auto 1fr auto auto; gap: 11px; align-items: center; padding: 11px 12px; width: 100%; text-align: left; border: 0; background: none; position: relative; }
.row + .row::before { content: ""; position: absolute; top: 0; left: 32px; right: 0; border-top: var(--hair); }
.row:active, .row:hover { background: var(--surface-2); }
.row .nm { display: block; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .sub { display: block; font-size: 12.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .pr { font: 800 15.5px var(--f-round); text-align: right; }
.row .pr small { display: block; font: 500 11px var(--f-ui); color: var(--muted); }
.chev { width: 7px; height: 12px; color: var(--locked); }
.more { width: 100%; border: 0; background: none; color: var(--blue); font-weight: 600; padding: 12px; border-top: var(--hair); }
.filters { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin: 0 -4px; padding: 0 4px; }
.filters::-webkit-scrollbar { display: none; }
.fchip { flex: none; border: 0; background: var(--surface-2); border-radius: 16px; padding: 7px 12px; font-size: 13.5px; font-weight: 600; display: inline-flex; gap: 6px; align-items: center; }
.fchip span { color: var(--muted); font-weight: 500; }
.fchip[aria-pressed="true"] { background: var(--fg); color: var(--surface); }
.fchip[aria-pressed="true"] span { color: inherit; opacity: .7; }

/* Detail */
.dhead { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
.dhead h2 { margin: 0; font-size: 24px; font-weight: 800; letter-spacing: -.015em; line-height: 1.15; text-wrap: balance; }
.dhead p { margin: 3px 0 0; color: var(--muted); font-size: 13.5px; }
.xbtn { width: 32px; height: 32px; border-radius: 50%; border: 0; background: var(--surface-2); color: var(--muted); display: grid; place-items: center; flex: none; }
.xbtn svg { width: 12px; height: 12px; }
.pricecard { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: end; }
.bigp { font: 900 46px var(--f-round); letter-spacing: -.03em; line-height: 1; }
.bigp-sub { font-size: 13.5px; color: var(--muted); grid-column: 1; }
.cmp { text-align: right; grid-row: 1 / 3; grid-column: 2; align-self: center; }
.cmp b { font: 800 17px var(--f-round); display: block; }
.cmp span { font-size: 12px; color: var(--muted); display: block; }
.cmp .delta { font-size: 12px; font-weight: 700; }
.pills { display: flex; gap: 6px; flex-wrap: wrap; }
.st { font-size: 12.5px; font-weight: 600; padding: 5px 10px; border-radius: 14px; background: var(--surface-2); display: inline-flex; gap: 6px; align-items: center; }
.st.ok { color: var(--fresh-t); } .st.wait { color: var(--stale-t); }
.acts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.btn { border: 0; border-radius: 12px; padding: 13px 10px; font-size: 15px; font-weight: 700; background: var(--surface-2); color: var(--blue); display: flex; gap: 7px; justify-content: center; align-items: center; }
.btn.pri { background: var(--accent); color: var(--accent-ink); }
.btn.full { grid-column: 1 / -1; }
.btn[disabled] { color: var(--muted); cursor: default; }
.btn .p { font: 800 12.5px var(--f-round); opacity: .75; }
.baas { display: grid; grid-template-columns: auto 1fr auto; gap: 11px; align-items: center; padding: 12px; }
.baas .t { font-size: 12px; color: var(--muted); }
.baas b { font-size: 15px; }
.crownic { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; background: color-mix(in srgb, var(--accent) 22%, transparent); color: var(--accent-text); }
.crownic svg { width: 20px; height: 20px; }
.crownic.vac { background: color-mix(in srgb, var(--old) 16%, transparent); color: var(--old-t); }
.crownic.lk { background: var(--surface-2); color: var(--muted); }
.expiry { padding: 0 12px 12px; display: grid; gap: 6px; font-size: 12.5px; color: var(--muted); }
.expiry .track { height: 5px; border-radius: 3px; background: var(--surface-2); overflow: hidden; }
.expiry .track i { display: block; height: 100%; border-radius: 3px; }
.expiry b { color: var(--fg); }
.stam { border-bottom: var(--hair); }
.stam .crownic { background: color-mix(in srgb, var(--accent) 22%, transparent); color: var(--accent-text); }
.stam.vrij .crownic { background: var(--surface-2); color: var(--muted); }
.stam .expiry { padding-top: 0; }
.tl { list-style: none; margin: 0; padding: 4px 12px; }
.tl li { display: grid; grid-template-columns: 14px 1fr; gap: 10px; padding: 9px 0; position: relative; }
.tl li::before { content: ""; position: absolute; left: 6px; top: 22px; bottom: -9px; border-left: 1.5px solid var(--sep); }
.tl li:last-child::before { display: none; }
.tl .k { width: 13px; height: 13px; border-radius: 50%; margin-top: 3px; border: 2.5px solid var(--surface); box-shadow: 0 0 0 1.5px var(--locked); background: var(--surface); }
.tl .k.chg { background: var(--accent); box-shadow: 0 0 0 1.5px var(--accent); }
.tl .k.first { background: var(--blue); box-shadow: 0 0 0 1.5px var(--blue); }
.tl .what { font-size: 14px; font-weight: 600; }
.tl .what s { color: var(--muted); font-weight: 500; }
.tl .who { font-size: 12.5px; color: var(--muted); }
.tl .pend { color: var(--stale-t); font-weight: 600; }
.spark { width: 100%; height: 64px; display: block; }
.spark .ln { fill: none; stroke: var(--accent); stroke-width: 2.2; stroke-linejoin: round; }
.spark .ar { fill: var(--accent); opacity: .16; }
.spark .gd { stroke: var(--sep); }
.spark .md { stroke: var(--muted); stroke-dasharray: 3 4; opacity: .7; }
.spark text { fill: var(--muted); font: 600 10px var(--f-ui); }

/* Formulier */
.form { display: grid; gap: 16px; }
.field { display: grid; gap: 7px; }

.cell + .cell { border-top: var(--hair); }

/* Toast (iOS-banner) */
.toasts { position: fixed; top: calc(env(safe-area-inset-top, 0px) + 62px); left: 50%; transform: translateX(-50%); width: min(400px, calc(100% - 24px)); display: grid; gap: 8px; z-index: 60; pointer-events: none; }

      const inW = pubs.filter(p=>p.wijk===w), tel = {};
      inW.forEach(p => { if (p.baas) tel[p.baas] = (tel[p.baas]||0)+1; });
      const best = Object.entries(tel).sort((a,b)=>b[1]-a[1]);
      out[w] = {tot: inW.length, eigenaar: best[0]?.[0] || null, n: best[0]?.[1] || 0};
    });
    return out;
  }
  function drawWijken(){
    const own = eigenaars();
    $('#wijkLayer').innerHTML = Object.entries(DISTRICTS).map(([k]) => {
      const pts = hull(pubs.filter(p=>p.wijk===k).map(p=>[p.x,p.y])); if (!pts.length) return '';
      const o = own[k].eigenaar, c = o ? S[o].kleur : 'var(--locked)';
      const dd = pts.length > 2 ? `M${pts.map(p=>p.join(' ')).join('L')}Z` : `M${pts[0][0]} ${pts[0][1]}L${(pts[1]||pts[0]).join(' ')}`;
      const cx = pts.reduce((a,p)=>a+p[0],0)/pts.length, cy = pts.reduce((a,p)=>a+p[1],0)/pts.length;
      return `<path class="wijk-blob" d="${dd}" fill="${c}" stroke="${c}" stroke-width="44" stroke-linejoin="round"/><text class="wijk-lbl" x="${cx}" y="${cy+30}" text-anchor="middle" fill="${c}">${o ? (o==='me'?'JIJ':S[o].naam) : 'vrij'}</text>`;
    }).join('');
    mapEl.classList.toggle('show-wijken', game.wijken && game.kroegbaas);

  /* ================= Sheet met drie standen ================= */
  const sheet = $('#sheet');
  let detent = 'peek';
  function sheetY(d){
    const h = sheet.getBoundingClientRect().height || innerHeight;
    return d === 'full' ? 0 : d === 'mid' ? Math.max(0, h - innerHeight*0.56) : Math.max(0, h - SHEET_PEEK);
  }
  function setDetent(d){ detent = d; if (!wide()) sheet.style.setProperty('--sy', sheetY(d)+'px'); }
  (function dragSheet(){
    const g = $('#grab'); let s = null;
    g.addEventListener('pointerdown', e => { if (wide() || e.target.closest('input,button')) return; s = {y:e.clientY, y0:sheetY(detent), t:performance.now()}; sheet.classList.add('dragging'); try { g.setPointerCapture(e.pointerId); } catch {} });
    g.addEventListener('pointermove', e => { if (!s) return; sheet.style.setProperty('--sy', Math.max(0, s.y0 + e.clientY - s.y)+'px'); });
    const end = e => {
      if (!s) return; sheet.classList.remove('dragging');
      const dy = e.clientY - s.y, v = dy / Math.max(1, performance.now()-s.t), y = s.y0 + dy, ord = ['full','mid','peek'];
      let best = ord.map(d => [d, sheetY(d)]).reduce((a,b) => Math.abs(b[1]-y) < Math.abs(a[1]-y) ? b : a)[0];
      if (Math.abs(dy) < 6) best = detent === 'peek' ? 'mid' : detent;
      else if (Math.abs(v) > .6) { const i = ord.indexOf(detent); best = ord[Math.max(0, Math.min(2, i + (v>0?1:-1)))]; }
      s = null; setDetent(best);
    };
    g.addEventListener('pointerup', end); g.addEventListener('pointercancel', end);
  })();

  /* ================= Weergaven ================= */
  let tab = 'kroegen', filter = 'goedkoop', showAll = false, query = '', lbWhen = 'maand', form = null;
  const body = $('#body');
  const FILTERS = () => [
    {id:'goedkoop', naam:'Goedkoopst', f:p=>p.unlocked, sort:(a,b)=>per25(a)-per25(b)},
    {id:'slot', naam:'Op slot', f:p=>!p.unlocked, sort:(a,b)=>afstand(a)-afstand(b)},
    game.kroegbaas
      ? {id:'vrij', naam:'Titel vrij', f:p=>p.unlocked && !p.baas, sort:(a,b)=>b.age-a.age}
      : {id:'vrij', naam:'Oud, 90+ dagen', f:p=>fresh(p)==='old', sort:(a,b)=>b.age-a.age},
    ...(game.kroegbaas ? [{id:'mijn', naam:'Mijn titels', f:p=>p.baas==='me', sort:(a,b)=>b.baasCheck-a.baasCheck}] : []),
    {id:'dichtbij', naam:'Dichtbij', f:()=>true, sort:(a,b)=>afstand(a)-afstand(b)}
  ];

  function homeView(){
    const n = {fresh:0, stale:0, old:0, locked:0}; pubs.forEach(p => n[fresh(p)]++);

    const fs = FILTERS(); if (!fs.find(f=>f.id===filter)) filter = 'goedkoop';
    const F = fs.find(f=>f.id===filter);
    const q = query.trim().toLowerCase();
    let rows = pubs.filter(q ? (p => (p.naam+' '+p.adres).toLowerCase().includes(q)) : F.f).sort(q ? ((a,b)=>a.naam.localeCompare(b.naam)) : F.sort);

      </div>
      <div class="tiles">
        <div class="tile"><b class="tn">${eur(mediaan())}</b><span>mediaan per 25 cl</span></div>
        <div class="tile"><b class="tn">${Math.round(n.fresh/un*100)}%</b><span>prijzen vers</span></div>
        ${game.kroegbaas ? `<div class="tile"><b class="tn">${pubs.filter(p=>p.baas==='me').length}</b><span>jouw titels</span></div>` : `<div class="tile"><b class="tn">${mijnBijdragen()}</b><span>jouw bijdragen</span></div>`}
      </div>
      ${!game.kroegbaas ? (() => { const w = weekStats(); return `<button class="mini" data-goto="samen">
        <span class="top">Samen deze week <span class="tn">${w.n} van ${WEEKDOEL}</span></span>
        <span class="bar"><i style="width:${Math.min(100, w.n/WEEKDOEL*100)}%"></i></span>

  }
  function rowHtml(p){
    const st = fresh(p);
    let sub;
    if (!p.unlocked) sub = `${DISTRICTS[p.wijk].naam} · ${fmtAfstand(afstand(p))} · speel vrij voor +50`;
    else if (game.kroegbaas && p.baas === 'me') sub = `Jouw titel · verloopt over ${90-p.baasCheck} dagen`;
    else if (game.kroegbaas && !p.baas) sub = `${DISTRICTS[p.wijk].naam} · titel vrij · ${p.age} dagen niet gecheckt`;
    else if (!game.kroegbaas && st === 'old') sub = `${DISTRICTS[p.wijk].naam} · ${p.age} dagen oud · controleer voor +${OUD_BONUS}`;
    else sub = `${DISTRICTS[p.wijk].naam} · ${p.merk}, ${glas(p.glas).naam.toLowerCase()} · ${geleden(p.age)}`;
    return `<button class="row" data-open="${p.id}">

  function spark(p){
    const pts = p.events.filter(e => e.t !== 'check').map(e => [e.d, Math.round(e.prijs*25/glas(p.glas).cl)]);
    pts.push([0, per25(p)]);
    const maxD = Math.max(365, ...pts.map(q=>q[0])), w = 320, h = 64, md = mediaan();
    const vals = pts.map(q=>q[1]).concat(md), lo = Math.min(...vals)-15, hi = Math.max(...vals)+15;
    const X = d => 4 + (1 - d/maxD)*(w-44), Y = c => 6 + (h-18)*(1-(c-lo)/(hi-lo));
    let path = `M${X(pts[0][0]).toFixed(1)} ${Y(pts[0][1]).toFixed(1)}`;
    for (let i=1;i<pts.length;i++) path += `H${X(pts[i][0]).toFixed(1)}V${Y(pts[i][1]).toFixed(1)}`;

  /* Stamgast: wie het vaakst de prijs bijwerkte of bevestigde. Telt bevestigde meldingen

  const STAMGAST_MIN = 2;
  function bijdragers(p){
    const t = {};

    p.events.filter(e => !e.pending).forEach(e => { tel(e.by, e.d); (e.bev || []).forEach(b => tel(b, e.d)); });
    return Object.values(t).sort((a,b) => b.n - a.n || b.laatst - a.laatst);
  }
  function stamgastHtml(p){
    const lijst = bijdragers(p), top = lijst[0], stam = top && top.n >= STAMGAST_MIN ? top : null;

  function historyHtml(p){

  function bijdragersHtml(p){

  function formHtml(p){

        <div class="calc">Dat is <b class="tn">${eur(norm)}</b> per 25 cl. Mediaan in Nijmegen: <b class="tn">${eur(md)}</b>.</div>

      </div>

        <div class="cell"><label class="filebtn" for="foto"><b>Foto van de prijslijst</b><span>Optioneel, +5. Versnelt de bevestiging.</span><input type="file" id="foto" accept="image/*"></label></div>
      </div>

      <p class="calc" style="margin:-6px 4px 0">Je punten komen binnen zodra een andere speler je prijs bevestigt.</p>

  function formPts(p){

  }

  function leaderView(){
    const rows = SPELERS.map(s => ({id:s.id, pts:PTS[s.id][lbWhen], titels:pubs.filter(p=>p.baas===s.id).length, ontdekt:pubs.filter(p=>ontdekker(p)===s.id).length, bijdragen:bijdragenVan(s.id)})).sort((a,b)=>b.pts-a.pts);
    const mi = rows.findIndex(r=>r.id==='me'), own = eigenaars();
    return `
      <div class="lt"><h1>Ranglijst</h1><p>Nijmegen</p></div>
      <div class="segm" style="margin-top:-6px">${['week','maand','altijd'].map(w=>`<button aria-pressed="${w===lbWhen}" data-w="${w}">${w==='altijd'?'Altijd':w==='week'?'Deze week':'Deze maand'}</button>`).join('')}</div>
      ${!game.kroegbaas ? `<p class="goal">Iedereen speelt dezelfde stad vrij. De ranglijst laat zien wie daar het meest aan bijdraagt.</p>` : ''}
      <p class="goal">${mi>0 ? `Nog <b>${nf(rows[mi-1].pts-rows[mi].pts+1)} punten</b> tot plek ${mi}. Een kroeg vrijspelen ter plaatse levert 75 op.` : 'Je staat <b>bovenaan</b>. Houd je prijzen vers.'}</p>
      <div class="grp">${rows.map((r,i)=>`<div class="lbr${r.id==='me'?' me':''}"><span class="rk${i<3?' top':''}">${i+1}</span>${av(r.id,true)}<div class="who"><b>${naamVan(r.id)}</b><span>${r.ontdekt} ontdekt · ${r.bijdragen} bijdragen${game.kroegbaas?` · ${r.titels} titels`:''}</span></div><span class="sc tn">${nf(r.pts)}</span></div>`).join('')}</div>
      ${game.kroegbaas && game.wijken ? `<div><p class="cap">Wijken</p><div class="wgrid">${Object.entries(DISTRICTS).map(([k,d])=>{const o=own[k];const c=o.eigenaar?S[o.eigenaar].kleur:'var(--locked)';return `<div class="wcard"><b>${d.naam}</b><span>${o.eigenaar?`${naamVan(o.eigenaar)} · ${o.n} van ${o.tot}`:'Niemand'}</span><div class="wb"><i style="width:${o.tot?o.n/o.tot*100:0}%;background:${c}"></i></div></div>`}).join('')}</div></div>` : ''}`;
  }

  function spelView(){
    return `
      <div class="lt"><h1>Spel</h1><p>Zet onderdelen aan of uit en kijk wat er op de kaart verandert</p></div>
      <div class="grp">
        <div class="cell"><div><b>Kroegbaas-titels</b><span>Wie de laatste bevestigde prijswijziging meldt, wordt kroegbaas. Kronen op de kaart.</span></div><input type="checkbox" class="sw" id="sw-kroegbaas" ${game.kroegbaas?'checked':''} aria-label="Kroegbaas-titels"></div>
        <div class="cell"><div><b>Wijken</b><span>Wie de meeste titels in een wijk heeft, beheerst die wijk. Werkt alleen samen met kroegbaas-titels.</span></div><input type="checkbox" class="sw" id="sw-wijken" ${game.wijken&&game.kroegbaas?'checked':''} ${game.kroegbaas?'':'disabled'} aria-label="Wijken"></div>
      </div>
      <div><p class="cap">Punten</p><div class="grp"><table class="pt">
        <tr><td>Kroeg vrijspelen<small>Eerste prijs ooit. Je blijft de ontdekker.</small></td><td>+50</td></tr>
        <tr><td>Prijswijziging melden<small>${game.kroegbaas?'Na bevestiging word je kroegbaas.':'Telt pas na bevestiging.'}</small></td><td>+30</td></tr>
        ${game.kroegbaas?'<tr><td>Vrije titel pakken<small>De kroegbaas checkte 90 dagen niet zelf.</small></td><td>+25</td></tr>':''}
        <tr><td>“Klopt nog”<small>Max. 1 keer per kroeg per 7 dagen.</small></td><td>+5</td></tr>
        <tr><td>Foto van de prijslijst</td><td>+5</td></tr>
        <tr><td>Ter plaatse<small>Binnen 75 m, via je locatie.</small></td><td>×1,5</td></tr>
        <tr><td>Bijdrage weerlegd<small>Ook je betrouwbaarheid daalt.</small></td><td class="neg">−20</td></tr>
      </table></div></div>
      ${game.kroegbaas ? `<div class="prose"><p class="cap">Kroegbaas</p>
        <p>Je wordt kroegbaas door een prijswijziging te melden die een ander bevestigt. Zolang de prijs gelijk blijft, houd je de titel.</p>
        <p>Je verliest hem op twee manieren: iemand meldt een nieuwe, bevestigde prijswijziging, of je hebt de kroeg zelf 90 dagen niet gecontroleerd. Een check door iemand anders houdt jouw titel niet in leven.</p>
        <p class="m">Zonder verloop blijven titels voor altijd bij spelers die allang gestopt zijn. Nu heeft elke kroegbaas een reden om terug te komen, en blijven ook kroegen met een vaste prijs vers.</p></div>` : ''}
      <div class="prose"><p class="cap">Controle door spelers</p>
        <p>Een prijs telt pas als een andere speler hem bevestigt. Wie vaak gelijk krijgt, bouwt betrouwbaarheid op; boven 90% is jouw bevestiging alleen al genoeg. Er is geen beheerder die elke invoer goedkeurt.</p>
        <p class="m">Geen tokens, geen virtueel vastgoed. We belonen bijdragen, niet drinken. Alleen voor 18+.</p></div>`;
  }

  const WEEKDOEL = 12;
  const bijdragenVan = id => pubs.reduce((a,p) => a + p.events.filter(e => e.by === id && !e.pending).length, 0);
  const mijnBijdragen = () => bijdragenVan('me');
  function weekStats(){ const ev = pubs.flatMap(p => p.events.filter(e => e.d < 7 && !e.pending)); return {n: ev.length, spelers: new Set(ev.map(e => e.by)).size}; }
  const CHECK = '<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m2.5 6.5 2.3 2.3 4.7-5"/></svg>';
  function samenView(){
    const un = pubs.filter(p=>p.unlocked).length, tot = pubs.length, pct = Math.round(un/tot*100);
    const MS = [25,50,75,100], next = MS.find(m => m > pct), nodig = next ? Math.ceil(next/100*tot) - un : 0;
    const w = weekStats(), oud = pubs.filter(p=>fresh(p)==='old').length, vers = pubs.filter(p=>fresh(p)==='fresh').length;
    const mijnOntdekt = pubs.filter(p=>ontdekker(p)==='me').length;
    const feed = pubs.flatMap(p => p.events.filter(e => e.d <= 14).map(e => ({e, p}))).sort((a,b) => a.e.d - b.e.d).slice(0, 8);
    const C = 2*Math.PI*42;
    return `
      <div class="lt"><h1>Samen</h1><p>Iedereen speelt dezelfde stad vrij en houdt hem vers</p></div>
      <div class="grp">
        <div class="together">
          <div class="bigring"><svg viewBox="0 0 100 100" aria-hidden="true"><circle class="bg" cx="50" cy="50" r="42"/><circle class="fg" cx="50" cy="50" r="42" stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${(C*(1-un/tot)).toFixed(1)}"/></svg><b class="tn">${pct}%</b></div>
          <div><h3>Nijmegen vrijgespeeld</h3><p>${un} van ${tot} kroegen, samen met ${SPELERS.length - 1} anderen. Jij ontdekte er ${mijnOntdekt}.</p></div>
        </div>
        <div class="ms">
          <div class="track"><i style="width:${pct}%"></i>${MS.map(m => `<span class="mk${pct>=m?' done':''}" style="left:${m}%">${pct>=m?CHECK:''}</span>`).join('')}</div>
          <div class="lbls">${MS.map(m => `<span style="left:${m}%">${m}%</span>`).join('')}</div>
          <p>${next ? `Nog <b>${nodig} ${nodig===1?'kroeg':'kroegen'}</b> tot de mijlpaal van ${next}%.` : '<b>De hele stad is vrijgespeeld.</b> Nu alles vers houden.'}</p>
        </div>
      </div>
      <div><p class="cap">Doelen deze week</p><div class="grp">
        <div class="wk"><div class="top">Bijdragen van iedereen <span class="tn">${w.n} / ${WEEKDOEL}</span></div><div class="bar"><i style="width:${Math.min(100,w.n/WEEKDOEL*100)}%;background:var(--accent)"></i></div><small>${w.spelers} spelers deden deze week mee.</small></div>
        <div class="wk"><div class="top">Oude prijzen verversen <span class="tn">nog ${oud}</span></div><div class="bar"><i style="width:${Math.round((1-oud/un)*100)}%;background:var(--fresh)"></i></div><small>Prijzen van 90 dagen of ouder. Een controle levert +${OUD_BONUS} op.</small></div>
        <div class="wk"><div class="top">Vers houden <span class="tn">${Math.round(vers/un*100)}%</span></div><div class="bar"><i style="width:${Math.round(vers/un*100)}%;background:var(--fresh)"></i></div><small>Deel van de prijzen dat de laatste 30 dagen is gecontroleerd.</small></div>
      </div></div>
      <div><p class="cap">Per wijk</p><div class="grp">${Object.entries(DISTRICTS).map(([k,d]) => {
        const inW = pubs.filter(p=>p.wijk===k), n = {fresh:0, stale:0, old:0, locked:0}; inW.forEach(p => n[fresh(p)]++);
        return `<div class="wrow"><b>${d.naam}</b><div class="bar">${['fresh','stale','old','locked'].map(f => `<i style="flex-grow:${n[f]};background:${KLEUR[f]}${f==='locked'?';opacity:.35':''}"></i>`).join('')}</div><span class="tn">${inW.length-n.locked}/${inW.length}</span></div>`;
      }).join('')}</div></div>
      <div><p class="cap">Recent in de stad</p><div class="grp"><ul class="feed">${feed.map(({e,p}) => {
        const wat = e.t === 'eerst' ? 'speelde vrij:' : e.t === 'wijziging' ? 'meldde een nieuwe prijs bij' : 'controleerde';
        return `<li>${av(e.by, true)}<div><span>${naamVan(e.by)} ${wat} </span><button data-open="${p.id}">${p.naam}</button><small>${geleden(e.d)}${e.pending ? ' · wacht op bevestiging' : ''}</small></div></li>`;
      }).join('')}</ul></div></div>
      <div><p class="cap">Punten</p><div class="grp"><table class="pt">
        <tr><td>Kroeg vrijspelen<small>Eerste prijs ooit. Je blijft de ontdekker.</small></td><td>+50</td></tr>
        <tr><td>Prijswijziging melden<small>Telt pas na bevestiging door een ander.</small></td><td>+30</td></tr>
        <tr><td>Oude prijs controleren<small>Prijs is 90 dagen of ouder.</small></td><td>+${OUD_BONUS}</td></tr>
        <tr><td>“Klopt nog”<small>Max. 1 keer per kroeg per 7 dagen.</small></td><td>+5</td></tr>
        <tr><td>Foto van de prijslijst</td><td>+5</td></tr>
        <tr><td>Ter plaatse<small>Binnen 75 m, via je locatie.</small></td><td>×1,5</td></tr>
        <tr><td>Bijdrage weerlegd<small>Ook je betrouwbaarheid daalt.</small></td><td class="neg">−20</td></tr>
      </table></div></div>
      <div class="prose"><p class="cap">Controle door spelers</p>
        <p>Een prijs telt pas als een andere speler hem bevestigt. Wie vaak gelijk krijgt, bouwt betrouwbaarheid op; boven 90% is jouw bevestiging alleen al genoeg. Er is geen beheerder die elke invoer goedkeurt.</p>
        <p class="m">Geen tokens, geen virtueel vastgoed. We belonen bijdragen, niet drinken. Alleen voor 18+.</p></div>`;
  }
  function draw(){
    if (selected !== null) body.innerHTML = detailView(pubs[selected]);
    else body.innerHTML = tab === 'kroegen' ? homeView() : tab === 'ranglijst' ? leaderView() : (FEATURES.veroveringen ? spelView() : samenView());
  }
  let shown = 0;
  function hud(){
    const un = pubs.filter(p=>p.unlocked).length;
    $('#chipCount').textContent = `Samen ${un}/${pubs.length} vrijgespeeld`;
    $('#ringFg').setAttribute('stroke-dashoffset', (94.25*(1-un/pubs.length)).toFixed(2));
    const to = PTS.me.altijd, from = shown, el = $('#mePts'), t0 = performance.now();
    if (reduce || from === to) { shown = to; el.textContent = nf(to); return; }
    (function s(t){ const e = Math.min(1,(t-t0)/700); shown = Math.round(from+(to-from)*e); el.textContent = nf(shown); if (e<1) requestAnimationFrame(s); })(t0);
  }
  function refreshAll(){ updatePinContent(); layoutPins(); drawWijken(); hud(); draw(); }

  /* ================= Interactie ================= */
  function openPub(id){
    selected = id; form = null; updatePinContent(); draw(); body.scrollTop = 0;
    if (!wide()) setDetent('mid');
    const p = pubs[id], v = visibleRect(), k = Math.max(T.k, 1.6);
    T.k = k; T.tx = v.x + v.w/2 - p.x*k; T.ty = (wide() ? v.h*0.5 : innerHeight*0.44*0.58) - p.y*k; apply(true);
  }
  function closePub(){ selected = null; form = null; updatePinContent(); layoutPins(); draw(); if (!wide()) setDetent('peek'); }
  function setTab(t){ tab = t; selected = null; form = null; $('#tabs').querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed', String(x.dataset.tab===t))); updatePinContent(); layoutPins(); draw(); body.scrollTop = 0; }

  $('#tabs').addEventListener('click', e => { const b = e.target.closest('[data-tab]'); if (!b) return; setTab(b.dataset.tab); if (!wide() && detent==='peek') setDetent('mid'); });
  $('#meBtn').onclick = () => { setTab('ranglijst'); if (!wide()) setDetent('mid'); };
  $('#q').addEventListener('input', e => { query = e.target.value; if (tab !== 'kroegen' || selected !== null) setTab('kroegen'); else draw(); });
  $('#q').addEventListener('focus', () => { if (!wide()) setDetent('full'); });

  body.addEventListener('click', e => {
    const t = e.target;
    const o = t.closest('[data-open]'); if (o) return openPub(+o.dataset.open);
    const gt = t.closest('[data-goto]'); if (gt) { setTab(gt.dataset.goto); if (!wide() && detent==='peek') setDetent('mid'); return; }
    if (t.closest('[data-close]')) return closePub();
    const f = t.closest('[data-f]'); if (f) { filter = f.dataset.f; showAll = false; return draw(); }
    if (t.closest('[data-more]')) { showAll = true; return draw(); }
    const w = t.closest('[data-w]'); if (w) { lbWhen = w.dataset.w; return draw(); }
    if (t.closest('[data-cancel]')) { form = null; return draw(); }
    const p = pubs[selected];
    const a = t.closest('[data-act]')?.dataset.act;
    if (a === 'unlock' || a === 'change') { form = {mode: a, merk: p.merk || 'Heineken', glas: p.glas || 'vaasje', prijs: p.prijs || Math.round(mediaan()/10)*10, foto:false}; if (!wide()) setDetent('full'); draw(); body.scrollTop = 0; return; }
    if (a === 'check') return doCheck(p);
    const opt = t.closest('[data-k] .opt'); if (opt && form) { form[opt.parentElement.dataset.k] = opt.dataset.v; return draw(); }
    const st = t.closest('[data-step]'); if (st && form) { form.prijs = Math.max(50, form.prijs + +st.dataset.step); return draw(); }
  });
  body.addEventListener('change', e => {
    if (e.target.id === 'sw-kroegbaas') return setGame('kroegbaas', e.target.checked);
    if (e.target.id === 'sw-wijken') return setGame('wijken', e.target.checked);
    if (!form) return;
    if (e.target.id === 'foto') { form.foto = e.target.files.length > 0; const s = body.querySelector('[type=submit] .p'); if (s) s.textContent = '+' + formPts(pubs[selected]); }
    if (e.target.id === 'pin') { const v = parse(e.target.value); if (v) { form.prijs = v; draw(); } }
  });
  const parse = s => { const v = parseFloat(String(s).replace(',','.').replace(/[^\d.]/g,'')); return isFinite(v) && v > 0 ? Math.round(v*100) : null; };
  body.addEventListener('submit', e => {
    e.preventDefault();
    const p = pubs[selected], v = parse(body.querySelector('#pin').value); if (v) form.prijs = v;
    const pts = formPts(p), mode = form.mode;
    if (mode === 'change' && form.prijs === p.prijs && form.glas === p.glas) { toast('Dat is dezelfde prijs. Tik dan op “Klopt nog”.'); return; }
    const ev = mode === 'unlock'
      ? {t:'eerst', d:0, by:'me', prijs:form.prijs, bev:[], pending:true}
      : {t:'wijziging', d:0, by:'me', van:p.prijs, prijs:form.prijs, bev:[], pending:true};
    if (mode === 'unlock') { p.unlocked = true; p.anim = true; p.events = []; }
    Object.assign(p, {merk:form.merk, glas:form.glas, prijs:form.prijs, age:0}); p.events.push(ev);
    form = null;
    if (mode === 'unlock') ripple(p);
    toast(mode === 'unlock' ? `${p.naam} vrijgespeeld. Wacht op bevestiging.` : 'Prijs gemeld. Wacht op bevestiging.', `+${pts} straks`);
    refreshAll();
    if (!wide()) { setDetent('mid'); body.scrollTop = 0; }
    setTimeout(() => {
      const by = pick(ANDEREN);
      ev.pending = false; ev.bev = [by];
      if (game.kroegbaas) { p.baas = 'me'; p.baasSinds = 0; p.baasCheck = 0; }
      PTS.me.altijd += pts; PTS.me.maand += pts; PTS.me.week += pts;
      const un = pubs.filter(q=>q.unlocked).length;
      toast(`${S[by].naam} bevestigde je prijs.${game.kroegbaas ? ' Jij bent nu kroegbaas.' : mode === 'unlock' ? ` Nijmegen is nu samen ${Math.round(un/pubs.length*100)}% vrijgespeeld.` : ''}`, `+${pts}`);
      refreshAll();
    }, reduce ? 900 : 2600);
  });
  function doCheck(p){
    const wasVrij = game.kroegbaas && !p.baas, wasMine = game.kroegbaas && p.baas === 'me', wasOud = !game.kroegbaas && fresh(p) === 'old';
    const pts = wasVrij ? 25 : wasOud ? OUD_BONUS : 5;
    const ev = {t:'check', d:0, by:'me', prijs:p.prijs, pending:true};
    p.events.push(ev); p.age = 0;
    toast(wasVrij ? 'Check ingediend. Wacht op een tweede bron.' : wasMine ? 'Check ingediend. Na bevestiging wordt je titel verlengd.' : 'Check ingediend.', `+${pts} straks`);
    refreshAll();
    setTimeout(() => {
      ev.pending = false;
      if (wasVrij) { p.baas = 'me'; p.baasSinds = 0; }
      if (p.baas === 'me') p.baasCheck = 0;
      PTS.me.altijd += pts; PTS.me.maand += pts; PTS.me.week += pts;
      toast(wasVrij ? `Titel gepakt. Jij bent kroegbaas van ${p.naam}.` : wasMine ? 'Titel verlengd: weer 90 dagen.' : wasOud ? `${p.naam} is weer vers. Nog ${pubs.filter(q=>fresh(q)==='old').length} oude prijzen in de stad.` : 'Je check komt overeen met de rest.', `+${pts}`);
      refreshAll();
    }, reduce ? 800 : 1900);
  }
  function setGame(k, v){
    if (!FEATURES.veroveringen) return;
    game[k] = v; store.set(k, v);
    if (k === 'wijken' && v && !game.kroegbaas) { game.kroegbaas = true; store.set('kroegbaas', true); }
    refreshAll();
  }
  function ripple(p){
    if (reduce) return;
    const r = document.createElement('div'); r.className = 'ripple';
    r.style.left = (p.x*curT.k+curT.tx)+'px'; r.style.top = (p.y*curT.k+curT.ty)+'px';
    pinsEl.appendChild(r); setTimeout(() => r.remove(), 1200);
  }
  function toast(msg, pts){
    const t = document.createElement('div'); t.className = 'toast glass';
    t.innerHTML = `${pts?`<span class="tp">${pts}</span>`:''}<span>${msg}</span>`;
    $('#toasts').appendChild(t); setTimeout(() => t.remove(), 4000);
  }
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && selected !== null) closePub(); });

  /* ================= Start ================= */
  drawBase();
  buildPins();
  setDetent('peek');
  refreshAll();
  if (wide()) fit(340, 280, 700, 590); else fit(380, 320, 600, 520);
  addEventListener('resize', () => { setDetent(detent); layoutPins(); });
})();
</script>

</body>
</html>
